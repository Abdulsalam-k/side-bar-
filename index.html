<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Responsive Dashboard</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Toggle Button (Always Visible) -->
    <button class="menu-toggle" id="menuToggle">
        <i class="fas fa-bars"></i>
    </button>

    <div class="main_box">
        <!-- SIDEBAR (Starts Hidden) -->
        <nav class="sidebar_menu" id="sidebar">
            <div class="logo">
                <img src="images.jpg" alt="Logo">
                <a href="index.html">BRAND</a>
            </div>

            <ul>
                <li class="active"><a href="index.html"><i class="fas fa-qr-code"></i><span>Dashboard</span></a></li>
                <li><a href="shortcuts.html"><i class="fas fa-link"></i><span>Shortcut</span></a></li>
                <li><a href="overview.html"><i class="fas fa-stream"></i><span>Overview</span></a></li>
                <li><a href="events.html"><i class="fas fa-calendar-week"></i><span>Events</span></a></li>
                <li><a href="about.html"><i class="fas fa-question-circle"></i><span>About</span></a></li>
                <li><a href="services.html"><i class="fas fa-sliders-h"></i><span>Services</span></a></li>
                <li><a href="contacts.html"><i class="fas fa-phone-volume"></i><span>Contacts</span></a></li>
                <li><a href="feedback.html"><i class="fas fa-comment-alt"></i><span>Feedback</span></a></li>
            </ul>

            <div class="social_media">
                <a href="https://facebook.com"><i class="fab fa-facebook-f"></i></a>
                <a href="https://twitter.com"><i class="fab fa-twitter"></i></a>
                <a href="https://instagram.com"><i class="fab fa-instagram"></i></a>
                <a href="https://linkedin.com"><i class="fab fa-linkedin-in"></i></a>
            </div>
        </nav>

        <!-- MAIN CONTENT AREA -->
        <main class="content_area">
            <div class="welcome_note">
                <h1>Welcome to Dashboard</h1>
                <p>Click the menu icon to explore your options.</p>
            </div>
        </main>
    </div>

    <!-- JavaScript to handle showing/hiding -->
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const icon = menuToggle.querySelector('i');

        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('active');
            
            // Toggle icon between bars and X
            if (sidebar.classList.contains('active')) {
                icon.classList.replace('fa-bars', 'fa-times');
            } else {
                icon.classList.replace('fa-times', 'fa-bars');
            }
        });

        // Close menu if clicking outside of it
        document.addEventListener('click', (e) => {
            if (!sidebar.contains(e.target) && !menuToggle.contains(e.target)) {
                sidebar.classList.remove('active');
                icon.classList.replace('fa-times', 'fa-bars');
            }
        });
    </script>
</body>
</html>
